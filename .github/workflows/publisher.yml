name: Publisher

on:
  schedule:
    - cron: '0 8 * * 2'   # Tuesday 08:00 UTC
    - cron: '0 8 * * 5'   # Friday 08:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of articles to publish (default: 1)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml python-slugify

      - name: Run publisher
        run: python scripts/publisher.py
        env:
          PUBLISH_COUNT: ${{ github.event.inputs.count || '1' }}

      - name: Commit and push
        run: |
          git config user.name "Publisher Bot"
          git config user.email "jelissei.levin@gmail.com"
          git add src/content/blog/ BLOG_TOPIC_BACKLOG.md PIPELINE_STATUS.md
          git diff --cached --quiet && echo "Nothing to commit." || (
            git commit -m "publish: ${{ env.PUBLISHED_IDS }}" &&
            git pull --rebase origin master &&
            git push
          )

      # Tell Bing (and Yandex, Seznam, Naver) about the new pages via IndexNow.
      # Google does not use IndexNow; it reads the sitemap. Waits for the
      # Cloudflare deploy to serve the first URL, so the engines don't fetch a
      # 404. A failure here never fails the publish itself.
      - name: Notify IndexNow
        if: env.PUBLISHED_URLS != ''
        continue-on-error: true
        run: |
          first=$(echo "$PUBLISHED_URLS" | cut -d' ' -f1)
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$first")" = "200" ] && break
            sleep 15
          done
          urls=$(printf '%s\n' $PUBLISHED_URLS | sed 's/.*/"&"/' | paste -sd, -)
          curl -s -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"niquit.app\",\"key\":\"1ec2f934c79ddac2115d89853b28a29d\",\"keyLocation\":\"https://niquit.app/1ec2f934c79ddac2115d89853b28a29d.txt\",\"urlList\":[$urls]}"
