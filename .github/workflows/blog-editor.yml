name: Blog Editor

on:
  schedule:
    - cron: '0 9 * * 1'      # Mon 09:00 UTC — draft up to BATCH_SIZE topics
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Topics to draft in one run (default: 3)'
        required: false
        default: '3'

permissions:
  contents: write
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic pyyaml python-slugify

      - name: Run blog editor
        run: python scripts/blog_editor.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY1 }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '3' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push drafts (backstop)
        # The script itself commits and pushes after every single topic, so this
        # step normally finds nothing new. It runs even if the draft step above
        # failed partway (if: always()), as a safety net for any file that got
        # written but not yet committed before a crash, this is exactly the gap
        # that lost E-03 and E-04's completed work on 2026-07-27 when F-01 failed
        # and this step was skipped because it wasn't if: always().
        #
        # Scoped to DRAFTED_SLUGS (topics that actually finished) rather than
        # `git add`-ing the whole content tree: a blanket add also picks up
        # partial/broken files left on disk by a topic that failed partway (e.g.
        # F-01's 30-word [de] fragment on 2026-08-03), even though that topic's
        # own status was correctly reset to 'pending' in the backlog. Committing
        # those orphaned files anyway just leaves stale drafts in the repo that
        # get silently overwritten (and re-paid-for) next time F-01 is picked up.
        if: always()
        run: |
          git config user.name "Blog Editor Bot"
          git config user.email "jelissei.levin@gmail.com"

          if [ -n "$DRAFTED_SLUGS" ]; then
            IFS=',' read -ra SLUGS <<< "$DRAFTED_SLUGS"
            for slug in "${SLUGS[@]}"; do
              for lang in en ru de es fr; do
                f="src/content/blog/${lang}/${slug}.md"
                if [ -f "$f" ]; then git add "$f"; fi
              done
              f="public/images/blog/${slug}.svg"
              if [ -f "$f" ]; then git add "$f"; fi
              d="docs/fact-audits/${slug}"
              if [ -d "$d" ]; then git add "$d"; fi
            done
          fi

          # Always safe to sync regardless of per-topic outcome: these reflect
          # accurate status either way, including failed topics reset to pending.
          git add BLOG_TOPIC_BACKLOG.md PIPELINE_STATUS.md docs/fact-audits/_pilot_runs_log.json 2>/dev/null || true

          git diff --cached --quiet && echo "Nothing to commit, skipping." || (
            git commit -m "blog: draft ${DRAFTED_IDS:-unknown} (backstop)" &&
            git pull --rebase origin master &&
            git push
          )
