name: Steps 4-6 on existing drafts (E-02 remediation + first full audits)

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  steps456-existing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic pyyaml python-slugify

      - name: Run steps 4-6 on existing drafts
        run: python scripts/steps456_existing.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY1 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push reports (backstop)
        # The script itself commits and pushes after every single topic, so this
        # step normally finds nothing new. It runs even if a step above failed
        # partway (if: always()), as a safety net for any file that got written
        # but not yet committed before a crash.
        if: always()
        run: |
          git config user.name "Steps4-6 Bot"
          git config user.email "jelissei.levin@gmail.com"
          git add src/content/blog/ docs/fact-audits/ PIPELINE_STATUS.md
          git diff --cached --quiet && echo "Nothing to commit." || (
            git commit -m "steps4-6: remediation + first audits (backstop)" &&
            git pull --rebase origin master &&
            git push
          )
